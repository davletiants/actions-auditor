# Optional: copy to .github/actions-auditor.yml. On pull requests this file is read
# from the base branch, so a PR cannot relax the rules it is checked against.

# owner/repo[/path] globs exempt from the pinning requirement. Empty (strict) by default.
# The deny and compromised checks still apply to these.
allow: []
#  - my-org/*            # your own org's internal actions

# Always fail on these. Use "owner/repo" or a glob for a whole action, or "owner/repo@sha" for one commit.
deny: []
#  - some-vendor/*

# Override rule severities: error | warning | off
severity:
  comment-drift: warning
  fork-target: warning
  renamed-repo: warning
  archived-repo: warning
