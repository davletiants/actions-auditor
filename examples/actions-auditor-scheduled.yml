# Optional: weekly full scan. Catches things a PR check can't, like a tag you pinned
# months ago that later shows up in the known-compromised list, or a repo that was archived or renamed.
name: actions-auditor (scheduled)
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # No checkout needed: every workflow and action.yml is read through the API at the triggering commit.
      - uses: your-org/actions-auditor@0000000000000000000000000000000000000000 # v0.1.0
